<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabermetrics Lab</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f9f9f9; color: #333; }
        header { background: #004d40; color: white; padding: 1rem; text-align: center; }
        header a { color: white; text-decoration: none; font-size: 1.5rem; font-weight: bold; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        
        /* 共通のカードデザイン */
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { display: inline-block; background: #e0f2f1; color: #004d40; padding: 10px 20px; 
               text-decoration: none; border-radius: 20px; font-weight: bold; margin: 5px; transition: 0.3s; }
        .btn:hover { background: #004d40; color: white; }
        
        /* 詳細ページ用 */
        .formula { background: #eee; padding: 1rem; border-left: 5px solid #d81b60; font-family: monospace; margin: 1rem 0; }
        .back-link { display: inline-block; margin-top: 2rem; color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}">Sabermetrics Lab</a>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
